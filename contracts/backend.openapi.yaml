  # ==================== RECOMMENDATIONS ====================
  /api/v1/recommendations:
    get:
      tags: [Public API]
      summary: Listar recomendaciones públicas elegibles
      description: Solo PUBLISHED con publishedAt activo. El formato legacy es un array; paged=true devuelve metadatos fiables.
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/RecommendationCategory' }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 12 } }
        - name: paged
          in: query
          description: Solicita el wrapper RecommendationPage. Por defecto conserva el array legacy.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Recomendaciones públicas en orden displayOrder, publishedAt e id.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/RecommendationSummary' }
                  - $ref: '#/components/schemas/RecommendationPage'
        '400': { description: Parámetro o enum inválido }

  /api/v1/recommendations/featured:
    get:
      tags: [Public API]
      summary: Listar recomendaciones públicas destacadas
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 6 } }
      responses:
        '200':
          description: Lista, posiblemente vacía, de PUBLISHED y featured=true.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecommendationSummary' }

  /api/v1/recommendations/{slug}:
    get:
      tags: [Public API]
      summary: Obtener el detalle público de una recomendación
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Recomendación pública con restaurantes activos en orden editorial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationPublic' }
        '400': { description: Slug vacío }
        '404': { description: Slug inexistente o recomendación no pública }

  /api/v1/admin/recommendations:
    get:
      tags: [Private Admin API]
      summary: Listar recomendaciones para administración
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RecommendationStatus' }
        - { name: country, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/RecommendationCategory' }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '200':
          description: Página administrativa en formato array legacy.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecommendationAdmin' }
        '401': { description: Autenticación requerida }
        '403': { description: Requiere ADMIN o SUPERADMIN }
    post:
      tags: [Private Admin API]
      summary: Crear recomendación editorial
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationWriteRequest' }
      responses:
        '201':
          description: Recomendación creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationAdmin' }
        '400': { description: Payload inválido o contenido no publicable }
        '401': { description: Autenticación requerida }
        '403': { description: Requiere ADMIN o SUPERADMIN }
        '409': { description: featured solicitado para contenido no publicado }

  /api/v1/admin/recommendations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Private Admin API]
      summary: Obtener recomendación administrativa
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recomendación encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationAdmin' }
        '404': { description: Recomendación inexistente }
    put:
      tags: [Private Admin API]
      summary: Actualizar recomendación y opcionalmente sus asociaciones
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationWriteRequest' }
      responses:
        '200':
          description: Recomendación actualizada atómicamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationAdmin' }
        '400': { description: Payload, mercado, restaurante o posición inválidos }
        '404': { description: Recomendación o restaurante inexistente }
        '409': { description: featured solicitado para contenido no publicado }
    delete:
      tags: [Private Admin API]
      summary: Archivar lógicamente una recomendación
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Recomendación archivada }
        '404': { description: Recomendación inexistente }

  /api/v1/admin/recommendations/{id}/publish:
    patch:
      tags: [Private Admin API]
      summary: Publicar una recomendación
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Publicada; repetir conserva publishedAt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationAdmin' }
        '400': { description: Faltan campos editoriales obligatorios }
        '404': { description: Recomendación inexistente }

  /api/v1/admin/recommendations/{id}/archive:
    patch:
      tags: [Private Admin API]
      summary: Archivar y retirar featured
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Archivada de forma idempotente y featured=false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationAdmin' }
        '404': { description: Recomendación inexistente }

  /api/v1/admin/recommendations/{id}/feature:
    patch:
      tags: [Private Admin API]
      summary: Destacar una recomendación publicada
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Recomendación destacada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationAdmin' }
        '404': { description: Recomendación inexistente }
        '409': { description: La recomendación no está PUBLISHED }

  /api/v1/admin/recommendations/{id}/unfeature:
    patch:
      tags: [Private Admin API]
      summary: Retirar destacado
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: featured=false de forma idempotente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationAdmin' }
        '404': { description: Recomendación inexistente }

  /api/v1/admin/recommendations/{id}/restaurants:
    put:
      tags: [Private Admin API]
      summary: Reemplazar asociaciones de restaurantes atómicamente
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/RecommendationRestaurantLinkRequest' }
      responses:
        '200':
          description: Asociaciones reemplazadas preservando orden editorial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationAdmin' }
        '400': { description: Duplicado, posición o mercado inválido }
        '404': { description: Recomendación o restaurante inexistente }
