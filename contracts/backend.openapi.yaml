openapi: 3.0.3
info:
  title: Fudi API
  description: |-
    API REST para el sistema de reservas de restaurantes fudi.

    Separacion de consumo para frontend:
    - Public API: catalogo y contenido visible sin sesion.
    - Private User API: perfil, favoritos y reservas propias.
    - Private Restaurant API: backoffice, reservas operativas, promociones y horarios del restaurante autenticado.
    - Private Admin API: soporte y operaciones administrativas auditables.
  version: 2.1.0
  contact:
    name: Fudi Team
    email: reservas@fudi.es

servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo
  - url: https://www.fudi.es
    description: Servidor de producción público actual
  - url: https://api.fudi.es
    description: Servidor de producción alternativo/legacy

tags:
  - name: Public API
    description: Endpoints pensados para pantallas publicas, catalogo y discovery. No deben exponer PII.
  - name: Private User API
    description: Endpoints para perfil, favoritos y reservas del propio usuario autenticado.
  - name: Private Restaurant API
    description: Endpoints de backoffice y operacion del restaurante autenticado.
  - name: Private Admin API
    description: Endpoints administrativos o de soporte con acceso excepcional y auditable.
  - name: Users
    description: Gestión de usuarios y autenticación
  - name: Restaurants
    description: Gestión de restaurantes
  - name: Restaurant Groups
    description: Gestión de grupos/franquicias y su workspace de negocio
  - name: Menus
    description: Gestión de menús
  - name: Ratings
    description: Gestión de calificaciones con imágenes
  - name: Bookings
    description: Gestión de reservas
  - name: Dashboard
    description: Estadísticas y dashboard para restaurantes
  - name: Promotions
    description: Sistema de promociones
  - name: Favorites
    description: Favoritos de usuarios
  - name: Restaurant Follows
    description: Seguimiento de restaurantes por usuarios autenticados
  - name: Files
    description: Gestión de archivos
  - name: Availability
    description: FASE 2A - Disponibilidad y horarios
  - name: Schedules
    description: FASE 2A - Gestión de horarios del restaurante
  - name: Analytics
    description: FASE 2B - Analytics y Reporting

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido desde /api/v1/auth/login

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [USER, ADMIN, RESTAURANT, SUPERADMIN]
        imgUser:
          type: string
        city:
          type: string
        aboutMe:
          type: string
        birthdayDate:
          type: string
          format: date

    UserSecurityCapabilities:
      type: object
      properties:
        authProviders:
          type: array
          items:
            type: string
            enum: [LOCAL, GOOGLE]
        hasLocalPassword:
          type: boolean
        canChangePassword:
          type: boolean
        canSetLocalPassword:
          type: boolean
        canRequestPasswordReset:
          type: boolean
        requiresGoogleReauthForSetLocalPassword:
          type: boolean

    UserMarketPreferences:
      type: object
      properties:
        preferredCountryCode:
          type: string
          description: ISO alpha-2 del mercado preferido o WORLDWIDE
          example: ES
        preferredLocale:
          type: string
          nullable: true
          description: Locale preferido del usuario en formato lenguaje-país
          example: es-ES

    UserMarketPreferencesUpdateRequest:
      type: object
      properties:
        preferredCountryCode:
          type: string
          description: ISO alpha-2 válido o WORLDWIDE
          example: WORLDWIDE
        preferredLocale:
          type: string
          nullable: true
          description: Locale preferido en formato es-ES. Enviar cadena vacía para limpiar el valor.
          example: es-ES

    Restaurant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
          nullable: true
          maxLength: 120
        name:
          type: string
        phone:
          type: string
        restaurantType:
          type: string
          enum: [ITALIANA, MEXICANA, CHINA, JAPONESA, ESPAÑOLA, AMERICANA, VEGETARIANA, VEGANA]
        description:
          type: string
        city:
          type: string
        address:
          type: string
        number:
          type: string
        postalCode:
          type: string
        imageUrls:
          type: array
          maxItems: 10
          items:
            type: string
        coverImageUrl:
          type: string
          nullable: true
        openingTime:
          type: string
          format: time
        closingTime:
          type: string
          format: time
        status:
          type: boolean
        averageRating:
          type: number
          format: double
        discount:
          type: integer
        owner:
          $ref: '#/components/schemas/User'

    RestaurantOwnerSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        imgUser:
          type: string
        role:
          type: string
          enum: [USER, RESTAURANT, ADMIN, SUPERADMIN]

    RestaurantGroupSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string

    RestaurantGroupUserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        imgUser:
          type: string
        role:
          type: string
          enum: [USER, RESTAURANT, ADMIN, SUPERADMIN]

    RestaurantGroup:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        createdByAdmin:
          allOf:
            - $ref: '#/components/schemas/RestaurantGroupUserSummary'
          nullable: true
        businessOwner:
          allOf:
            - $ref: '#/components/schemas/RestaurantGroupUserSummary'
          nullable: true
        type:
          type: string
          enum: [INDEPENDENT_BUSINESS, FRANCHISE, CORPORATE_GROUP]
        lifecycleStatus:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        status:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RestaurantGroupCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          nullable: true
        description:
          type: string
          maxLength: 500
          nullable: true
        businessOwnerUserId:
          type: integer
          format: int64
        type:
          type: string
          enum: [INDEPENDENT_BUSINESS, FRANCHISE, CORPORATE_GROUP]
          nullable: true
        lifecycleStatus:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
          nullable: true
        status:
          type: boolean
          nullable: true

    RestaurantGroupUpdateRequest:
      type: object
      required:
        - name
        - businessOwnerUserId
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          nullable: true
        description:
          type: string
          maxLength: 500
          nullable: true
        businessOwnerUserId:
          type: integer
          format: int64
          nullable: true
        type:
          type: string
          enum: [INDEPENDENT_BUSINESS, FRANCHISE, CORPORATE_GROUP]
          nullable: true
        lifecycleStatus:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
          nullable: true
        status:
          type: boolean
          nullable: true

    RestaurantGroupStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: boolean

    RestaurantGroupMember:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        imgUser:
          type: string
        userRole:
          type: string
          enum: [USER, RESTAURANT, ADMIN, SUPERADMIN]
        groupRole:
          type: string
          enum: [GROUP_ADMIN, GROUP_VIEWER]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    RestaurantGroupMembershipCreateRequest:
      type: object
      required:
        - userId
        - role
      properties:
        userId:
          type: integer
          format: int64
        role:
          type: string
          enum: [GROUP_ADMIN, GROUP_VIEWER]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    RestaurantGroupMembershipUpdateRequest:
      type: object
      properties:
        role:
          type: string
          enum: [GROUP_ADMIN, GROUP_VIEWER]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    RestaurantGroupAccess:
      type: object
      properties:
        contextMode:
          type: string
          enum: [ADMIN_CONSOLE, BUSINESS_WORKSPACE]
        groupRole:
          type: string
          enum: [GROUP_ADMIN, GROUP_VIEWER]
          nullable: true
        canManageStructure:
          type: boolean
        canManageMembers:
          type: boolean
        canOperateBusiness:
          type: boolean
        canCreateRestaurantsInGroup:
          type: boolean
        canAssignOwner:
          type: boolean
        canMoveRestaurants:
          type: boolean
        ownerDerivedView:
          type: boolean
        businessOwner:
          type: boolean
        platformAdmin:
          type: boolean
        effectiveRoles:
          type: array
          items:
            type: string
        effectiveScopes:
          type: array
          items:
            type: string

    RestaurantGroupWorkspaceSummary:
      type: object
      properties:
        restaurantCount:
          type: integer
        activeRestaurantCount:
          type: integer
        inactiveRestaurantCount:
          type: integer
        memberCount:
          type: integer

    RestaurantGroupWorkspaceRestaurant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        city:
          type: string
          nullable: true
        status:
          type: boolean
        owner:
          $ref: '#/components/schemas/RestaurantOwnerSummary'
        myRestaurantOwnerAccess:
          type: boolean
        myRestaurantMembershipRole:
          type: string
          enum: [MANAGER, VIEWER]
          nullable: true

    RestaurantGroupWorkspace:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/RestaurantGroup'
        access:
          $ref: '#/components/schemas/RestaurantGroupAccess'
        summary:
          $ref: '#/components/schemas/RestaurantGroupWorkspaceSummary'
        restaurants:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantGroupWorkspaceRestaurant'

    RestaurantMoveGroupRequest:
      type: object
      required:
        - groupId
      properties:
        groupId:
          type: integer
          format: int64

    AdminRestaurantOwnerAssignRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          format: int64

    RestaurantMember:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        imgUser:
          type: string
        globalRole:
          type: string
          enum: [USER, RESTAURANT, ADMIN, SUPERADMIN]
        membershipRole:
          type: string
          enum: [MANAGER, VIEWER]
        membershipStatus:
          type: string
          enum: [ACTIVE, INACTIVE, PENDING]

    RestaurantMembershipCreateRequest:
      type: object
      required:
        - userId
        - role
      properties:
        userId:
          type: integer
          format: int64
        role:
          type: string
          enum: [MANAGER, VIEWER]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PENDING]

    RestaurantMembershipUpdateRequest:
      type: object
      properties:
        role:
          type: string
          enum: [MANAGER, VIEWER]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PENDING]

    RestaurantInviteCreateRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [MANAGER, VIEWER]

    RestaurantInvite:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [MANAGER, VIEWER]
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED, CANCELLED]
        invitedByUserId:
          type: integer
          format: int64
          nullable: true
        invitedByEmail:
          type: string
          format: email
          nullable: true
        acceptedByUserId:
          type: integer
          format: int64
          nullable: true
        acceptedByEmail:
          type: string
          format: email
          nullable: true
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    RestaurantInvitePublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
        restaurantId:
          type: integer
          format: int64
        likesCount:
          type: integer
        liked:
          type: boolean

    MenuWriteRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        restaurantType:
          type: string
          enum: [ITALIANA, MEXICANA, CHINA, JAPONESA, ESPAÑOLA, AMERICANA, VEGETARIANA, VEGANA]
        active:
          type: boolean
        alergys:
          type: boolean
        photo:
          type: string
          format: binary
        restaurantName:
          type: string
        group:
          allOf:
            - $ref: '#/components/schemas/RestaurantGroupSummary'
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [MANAGER, VIEWER]
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED, CANCELLED]
        expiresAt:
          type: string
          format: date-time
        authenticatedUserEmail:
          type: string
          nullable: true
          description: Email que backend ve en la sesión autenticada actual, si existe.
        authenticatedUserMatchesInviteEmail:
          type: boolean
          nullable: true
          description: Indica si el email autenticado coincide con el email de la invitación.

    RestaurantInviteAcceptResponse:
      type: object
      properties:
        token:
          type: string
        userRole:
          type: string
          enum: [USER, RESTAURANT, ADMIN, SUPERADMIN]
        membership:
          $ref: '#/components/schemas/RestaurantMember'
        invite:
          $ref: '#/components/schemas/RestaurantInvitePublic'

    RestaurantPublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
        restaurantType:
          type: string
        description:
          type: string
        openingTime:
          type: string
          format: time
        closingTime:
          type: string
          format: time
        status:
          type: boolean
        imageUrls:
          type: array
          items:
            type: string
        coverImageUrl:
          type: string
          nullable: true
        city:
          type: string
        address:
          type: string
        number:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
          description: ISO alpha-2 del país del restaurante
          example: ES
        timezone:
          type: string
          description: Timezone IANA del restaurante
          example: Europe/Madrid
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        averageRating:
          type: number
          format: double
        discount:
          type: integer
        group:
          $ref: '#/components/schemas/RestaurantGroupSummary'

    RestaurantBackoffice:
      allOf:
        - $ref: '#/components/schemas/RestaurantPublic'
        - type: object
          properties:
            autoConfirmPaxPerSlot:
              type: integer
            maxPaxPerSlot:
              type: integer
            reminderEnabled:
              type: boolean
            reminderMinutesBefore:
              type: integer
            notifyOnNewBooking:
              type: boolean
            notificationEmail:
              type: string
              format: email
              nullable: true
            owner:
              $ref: '#/components/schemas/RestaurantOwnerSummary'
            group:
              $ref: '#/components/schemas/RestaurantGroupSummary'

    Menu:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        imgMenu:
          type: string
        active:
          type: boolean
        restaurantType:
          type: string
          enum: [ITALIANA, MEXICANA, CHINA, JAPONESA, ESPAÑOLA, AMERICANA, VEGETARIANA, VEGANA]
        alergys:
          type: boolean
        restaurantId:
          type: integer
          format: int64

    MenuSection:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        position:
          type: integer
        active:
          type: boolean
        menuId:
          type: integer
          format: int64

    DishMenuRestaurant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        coverImageUrl:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        restaurantType:
          type: string

    DishMenuSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        imgMenu:
          type: string
          nullable: true
        active:
          type: boolean
        restaurantType:
          type: string
        alergys:
          type: boolean
        likesCount:
          type: integer
        restaurant:
          $ref: '#/components/schemas/DishMenuRestaurant'

    DishMenuSection:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
          nullable: true
        position:
          type: integer
          nullable: true
        active:
          type: boolean

    Dish:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        imgDish:
          type: string
        active:
          type: boolean
        alergys:
          type: boolean
        menu:
          $ref: '#/components/schemas/DishMenuSummary'
        menuSection:
          $ref: '#/components/schemas/DishMenuSection'

    DishUpsertRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        imgDish:
          type: string
        active:
          type: boolean
        alergys:
          type: boolean
        sectionId:
          type: integer
          format: int64
        photo:
          type: string
          format: binary

    DishFilterSection:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        position:
          type: integer
        totalDishes:
          type: integer
        activeDishes:
          type: integer

    DishFiltersResponse:
      type: object
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/DishFilterSection'
        totalDishes:
          type: integer
        minPrice:
          type: number
          format: double
        maxPrice:
          type: number
          format: double

    Rating:
      type: object
      properties:
        id:
          type: integer
          format: int64
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        likesCount:
          type: integer
          description: Número total de likes del rating
          default: 0
        restaurant:
          $ref: '#/components/schemas/Restaurant'
        user:
          $ref: '#/components/schemas/User'
        images:
          type: array
          items:
            $ref: '#/components/schemas/RatingImage'

    RatingAuthorPublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
          example: "Ana L."
        avatar:
          type: string

    RatingRestaurantSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        city:
          type: string
        coverImageUrl:
          type: string
          nullable: true

    RatingImagePublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
        imagePath:
          type: string
        imageOrder:
          type: integer

    RatingPublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        likesCount:
          type: integer
        restaurant:
          $ref: '#/components/schemas/RatingRestaurantSummary'
        author:
          $ref: '#/components/schemas/RatingAuthorPublic'
        images:
          type: array
          items:
            $ref: '#/components/schemas/RatingImagePublic'

    LikeResponse:
      type: object
      properties:
        message:
          type: string
          description: Mensaje descriptivo de la acción realizada
          example: "Like agregado"
        liked:
          type: boolean
          description: Estado actual del like (true si el usuario tiene like activo)
        likesCount:
          type: integer
          description: Número total de likes después de la acción

    RatingImage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        imagePath:
          type: string
          description: Nombre del archivo guardado
        imageOrder:
          type: integer
          description: Orden de la imagen (1, 2, 3)

    RatingRestaurantReference:
      type: object
      properties:
        id:
          type: integer
          format: int64

    RatingUpdateRequest:
      type: object
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        restaurantId:
          type: integer
          format: int64
        restaurant:
          $ref: '#/components/schemas/RatingRestaurantReference'

    BookingAcquisitionSource:
      type: string
      enum:
        - FUDI_PLATFORM
        - DIRECT_LINK
        - WIDGET
        - INSTAGRAM
        - SOCIAL_LINK
        - UNKNOWN
        - QR
        - FEED
        - RECOMMENDATION
        - CAMPAIGN
        - GOOGLE
      description: Origen de adquisición de la reserva. No debe usarse para autorización.

    FudiDirectInstallationType:
      type: string
      enum: [DIRECT_LINK, WIDGET_MODAL, WIDGET_INLINE, QR]

    FudiDirectChannel:
      type: string
      enum: [WEBSITE, INSTAGRAM, FACEBOOK, GOOGLE, EMAIL, PRINT, CAMPAIGN, OTHER]

    FudiDirectInstallationStatus:
      type: string
      enum: [ACTIVE, DISABLED, ARCHIVED]

    FudiDirectInstallationRequest:
      type: object
      required:
        - name
        - type
        - channel
        - allowedDomains
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: '#/components/schemas/FudiDirectInstallationType'
        channel:
          $ref: '#/components/schemas/FudiDirectChannel'
        status:
          $ref: '#/components/schemas/FudiDirectInstallationStatus'
        allowedDomains:
          type: array
          items:
            type: string
            maxLength: 180
        utmSource:
          type: string
          nullable: true
          maxLength: 160
        utmMedium:
          type: string
          nullable: true
          maxLength: 160
        utmCampaign:
          type: string
          nullable: true
          maxLength: 160
        utmContent:
          type: string
          nullable: true
          maxLength: 160

    FudiDirectInstallationStatusRequest:
      type: object
      required:
        - status
      properties:
