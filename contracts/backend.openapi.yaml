  # ==================== BOOKINGS ====================
  /api/v1/bookings:
    post:
      tags:
        - Bookings
        - Public API
      summary: Crear reserva
      description: Crea una nueva reserva con estado CONFIRMED o WAITLIST según capacidad por slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookingDate
                - bookingTime
                - numPeople
                - restaurantId
                - acceptedTerms
              properties:
                restaurantId:
                  type: integer
                  format: int64
                  example: 12
                bookingDate:
                  type: string
                  format: date
                  example: "2024-01-20"
                bookingTime:
                  type: string
                  format: time
                  example: "20:00:00"
                numPeople:
                  type: integer
                  example: 4
                contactName:
                  type: string
                  example: "Juan Pérez"
                contactPhone:
                  type: string
                  example: "+34 612 345 678"
                contactEmail:
                  type: string
                  example: "guest@example.com"
                specialRequests:
                  type: string
                  example: "Mesa cerca de la ventana"
                acceptedTerms:
                  type: boolean
                  example: true
                acquisition:
                  allOf:
                    - $ref: '#/components/schemas/BookingAcquisitionContext'
                  nullable: true
                  description: Contexto opcional de adquisición. Si no se envía, backend debe usar FUDI_PLATFORM.
      responses:
        '201':
          description: Reserva creada con status CONFIRMED o WAITLIST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCustomer'

  /api/private/v1/bookings:
    get:
      tags:
        - Bookings
        - Private Admin API
      summary: Listar todas las reservas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingCustomer'

  /api/v1/bookings/public/{bookingCode}:
    get:
      tags:
        - Bookings
        - Public API
      summary: Obtener reserva publica de invitado
      parameters:
        - name: bookingCode
          in: path
          required: true
          schema:
            type: string
        - name: t
          in: query
          required: true
          schema:
            type: string
          description: Token firmado de acceso publico.
      responses:
        '200':
          description: Reserva publica encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCustomer'
        '404':
          description: Reserva publica no encontrada o token invalido

  /api/v1/bookings/public/{bookingCode}/customer-confirmation:
    post:
      tags:
        - Bookings
        - Public API
      summary: Confirmar asistencia del cliente desde email
      description: Endpoint publico para la landing de confirmacion. El frontend debe leer `bookingCode` y `ct` desde el email y ejecutar esta accion.
      parameters:
        - name: bookingCode
          in: path
          required: true
          schema:
            type: string
        - name: ct
          in: query
          required: true
          schema:
            type: string
          description: Token firmado de confirmacion del cliente.
      responses:
        '200':
          description: Confirmacion registrada o ya existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCustomerConfirmationResponse'
        '404':
          description: Reserva no encontrada o token invalido
        '409':
          description: La reserva ya no admite confirmacion o no habia solicitud pendiente

  /api/v1/bookings/public/{bookingCode}/customer-confirmation/decline:
    post:
      tags:
        - Bookings
        - Public API
      summary: Rechazar asistencia del cliente desde email o landing publica
      description: Endpoint publico para que el cliente indique que no asistira. La reserva queda marcada como `DECLINED` para monitoreo y deja de contar para aforo operativo.
      parameters:
        - name: bookingCode
          in: path
          required: true
          schema:
            type: string
        - name: ct
          in: query
          required: true
          schema:
            type: string
          description: Token firmado de confirmacion del cliente.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCustomerDeclineRequest'
      responses:
        '200':
          description: Rechazo registrado o ya existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCustomerConfirmationResponse'
        '404':
          description: Reserva no encontrada o token invalido
        '409':
          description: La reserva ya no admite rechazo o no habia solicitud pendiente

