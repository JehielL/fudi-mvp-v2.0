  # ==================== FASE 2A: DISPONIBILIDAD ====================
  /api/v1/restaurants/{restaurantId}/availability:
    get:
      tags:
        - Availability
        - Public API
      summary: Obtener disponibilidad de un día
      description: Endpoint publico para consulta de disponibilidad desde booking flow y detalle de restaurante.
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2025-01-15"
        - name: numPeople
          in: query
          required: false
          schema:
            type: integer
            default: 2
          description: Número de personas para filtrar capacidad
      responses:
        '200':
          description: Disponibilidad del día
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '404':
          description: Restaurante no encontrado

  /api/v1/restaurants/{restaurantId}/availability/week:
    get:
      tags:
        - Availability
        - Public API
      summary: Disponibilidad de una semana
      description: Endpoint publico para calendario de disponibilidad en flujos de reserva.
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: numPeople
          in: query
          required: false
          schema:
            type: integer
            default: 2
      responses:
        '200':
          description: Disponibilidad de la semana
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityResponse'

  /api/v1/restaurants/{restaurantId}/status/open-now:
    get:
      tags:
        - Availability
        - Public API
      summary: Saber si el restaurante está abierto ahora mismo
      description: >
        Evalúa si el restaurante está abierto exactamente en el instante indicado.
        Si el frontend envía `at` con offset, backend usa ese mismo instante y lo convierte
        a la zona operativa del restaurante antes de decidir el estado.
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: at
          in: query
          required: false
          description: Fecha/hora actual del cliente en ISO-8601 con offset, por ejemplo 2026-04-01T10:30:00-06:00
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Estado exacto de apertura/cierre en el instante evaluado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantOpenStatus'
        '404':
          description: Restaurante no encontrado

