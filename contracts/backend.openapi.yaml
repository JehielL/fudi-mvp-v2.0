    patch:
      tags:
        - Bookings
        - Private User API
      summary: Cancelar mi reserva
      description: Cancela de forma idempotente una reserva cuyo propietario es el usuario autenticado. No usa email, telefono ni bookingCode como prueba de ownership.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
