        restaurants:
          type: array
          items: { $ref: '#/components/schemas/RecommendationRestaurantLinkRequest' }

    RecommendationAdmin:
      allOf:
        - $ref: '#/components/schemas/RecommendationPublic'
        - type: object
          required: [status, displayOrder]
          properties:
            status: { $ref: '#/components/schemas/RecommendationStatus' }
            displayOrder: { type: integer }
            createdAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time, nullable: true }
            restaurants:
              type: array
              items: { $ref: '#/components/schemas/RecommendationRestaurantAdmin' }

    Error:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer

    # ==================== FASE 2A SCHEMAS ====================
    RestaurantSchedule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        restaurantId:
          type: integer
          format: int64
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        isOpen:
          type: boolean
        openTime:
          type: string
          format: time
          example: "09:00:00"
        closeTime:
          type: string
          format: time
          example: "23:00:00"
        lunchStart:
          type: string
          format: time
          nullable: true
        lunchEnd:
          type: string
          format: time
          nullable: true
        dinnerStart:
          type: string
          format: time
          nullable: true
        dinnerEnd:
          type: string
          format: time
          nullable: true
        maxCapacity:
          type: integer
          description: Aforo total del restaurante
        maxCapacityPerSlot:
          type: integer
          description: Máximo personas por slot
        defaultBookingDurationMinutes:
          type: integer
        slotIntervalMinutes:
          type: integer
          default: 30
          description: Duración del slot en minutos
        minAdvanceHours:
          type: integer
        maxAdvanceDays:
          type: integer
        acceptsOnlineBookings:
          type: boolean
        notes:
          type: string
          nullable: true

    RestaurantScheduleRequest:
      type: object
      required: [dayOfWeek]
      properties:
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        isOpen:
          type: boolean
        openTime:
          type: string
          format: time
        closeTime:
          type: string
          format: time
        lunchStart:
          type: string
          format: time
          nullable: true
        lunchEnd:
          type: string
          format: time
          nullable: true
        dinnerStart:
          type: string
          format: time
          nullable: true
        dinnerEnd:
          type: string
          format: time
          nullable: true
        maxCapacity:
          type: integer
        maxCapacityPerSlot:
          type: integer
        defaultBookingDurationMinutes:
          type: integer
        slotIntervalMinutes:
          type: integer
        minAdvanceHours:
          type: integer
        maxAdvanceDays:
          type: integer
        acceptsOnlineBookings:
          type: boolean
        notes:
          type: string
          nullable: true

    ClosedDate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        restaurantId:
          type: integer
          format: int64
        closedDate:
          type: string
          format: date
          example: "2025-12-25"
        reason:
          type: string
          example: "Navidad"
        isRecurringYearly:
          type: boolean
          description: Si se repite cada año

    ClosedDateRequest:
      type: object
      required: [closedDate]
      properties:
        closedDate:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        isRecurringYearly:
          type: boolean

    TimeSlotDTO:
      type: object
      properties:
        time:
          type: string
          format: time
          example: "19:00"
        availableCapacity:
          type: integer
          description: Personas que todavía caben en auto-confirmación
        maxCapacity:
          type: integer
          description: Capacidad auto-confirmable del slot
        isAvailable:
          type: boolean
        waitlistAvailable:
          type: boolean
        bookingMode:
          type: string
          enum: [CONFIRMED, WAITLIST, FULL]
        period:
          type: string
          description: Tramo operativo del slot (LUNCH, DINNER, GENERAL)

    AvailabilityResponse:
      type: object
      properties:
        restaurantId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        isOpen:
          type: boolean
        closedReason:
          type: string
          description: Motivo si está cerrado
          nullable: true
        minimumBookableAt:
          type: string
          format: date-time
          nullable: true
          description: Cutoff canónico calculado por backend para esa fecha
        evaluatedAtRestaurant:
          type: string
          format: date-time
          nullable: true
          description: Momento exacto en zona del restaurante usado para calcular disponibilidad
        restaurantTimeZone:
          type: string
          nullable: true
          description: Zona horaria usada por backend para el cálculo
        availableSlots:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotDTO'

    RestaurantOpenStatus:
      type: object
      properties:
        restaurantId:
          type: integer
          format: int64
        isOpenNow:
          type: boolean
        reason:
          type: string
          nullable: true
        statusSource:
          type: string
          enum: [CLOSED_DATE, WEEKLY_SCHEDULE, GENERAL_HOURS, NO_SCHEDULE]
        evaluatedAtRestaurant:
          type: string
          format: date-time
        restaurantTimeZone:
          type: string
          example: Europe/Madrid
        evaluatedAtClient:
          type: string
          format: date-time
          nullable: true

    # ==================== FASE 2B ANALYTICS SCHEMAS ====================
    PeriodDTO:
      type: object
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        periodName:
          type: string
          example: "Últimos 7 días"

    SummaryDTO:
      type: object
      properties:
        totalBookings:
          type: integer
        confirmedBookings:
          type: integer
        cancelledBookings:
          type: integer
        noShowBookings:
          type: integer
        totalGuests:
          type: integer
        avgPartySize:
          type: number
          format: double

    StatusMetricsDTO:
      type: object
      properties:
        pending:
          type: integer
        confirmed:
          type: integer
        completed:
          type: integer
        cancelled:
          type: integer
        noShow:
          type: integer
        rejected:
          type: integer

    RatesDTO:
      type: object
      properties:
        confirmationRate:
          type: number
          format: double
          description: "% reservas confirmadas"
        cancellationRate:
          type: number
          format: double
          description: "% reservas canceladas"
        noShowRate:
          type: number
          format: double
          description: "% no-shows"
        completionRate:
          type: number
          format: double
          description: "% completadas"

    ComparisonDTO:
      type: object
      properties:
        current:
          type: number
          format: double
        previous:
          type: number
          format: double
        changePercentage:
          type: number
          format: double
        trend:
          type: string
          enum: [UP, DOWN, STABLE]

    DailyMetricDTO:
      type: object
      properties:
        date:
          type: string
          format: date
        bookings:
          type: integer
        guests:
          type: integer

    HourlyMetricDTO:
      type: object
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        bookings:
          type: integer
        avgGuests:
          type: number
          format: double

    WeekdayMetricDTO:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: "1=Domingo, 2=Lunes... 7=Sábado"
        dayName:
          type: string
          example: "Lunes"
        bookings:
          type: integer
        avgGuests:
          type: number
          format: double

    TrendsDTO:
      type: object
      properties:
        dailyTrend:
          type: array
          items:
            $ref: '#/components/schemas/DailyMetricDTO'
        hourlyDistribution:
          type: array
          items:
            $ref: '#/components/schemas/HourlyMetricDTO'
        weekdayDistribution:
          type: array
          items:
            $ref: '#/components/schemas/WeekdayMetricDTO'

    InsightsDTO:
      type: object
      properties:
        peakHour:
          type: integer
          description: Hora con más reservas (0-23)
        peakDay:
          type: string
          example: "Sábado"
        avgLeadTimeDays:
          type: number
          format: double
          description: Días promedio de anticipación
        returningCustomerRate:
          type: number
          format: double
          description: "% clientes que vuelven"

    DashboardAnalyticsDTO:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/PeriodDTO'
        summary:
          $ref: '#/components/schemas/SummaryDTO'
        statusBreakdown:
          $ref: '#/components/schemas/StatusMetricsDTO'
        rates:
          $ref: '#/components/schemas/RatesDTO'
        trends:
          $ref: '#/components/schemas/TrendsDTO'
        insights:
          $ref: '#/components/schemas/InsightsDTO'
        comparisons:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComparisonDTO'
          description: "Comparaciones: bookings, guests, cancellationRate"

    QuickStatsDTO:
      type: object
      properties:
        todayBookings:
          type: integer
        todayGuests:
          type: integer
        weekBookings:
          type: integer
        weekGuests:
          type: integer
        monthBookings:
          type: integer
        monthGuests:
          type: integer
        pendingCount:
          type: integer

paths:
  # ==================== USERS ====================
  /api/v1/auth/register:
    post:
      tags:
        - Users
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      responses:
        '200':
          description: Usuario registrado exitosamente
        '400':
          description: Email ya existe

  /api/v1/auth/login:
    post:
      tags:
        - Users
      summary: Iniciar sesión
      description: Autentica un usuario, retorna un access token JWT y setea una cookie HttpOnly de refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Login exitoso
          headers:
            Set-Cookie:
              description: Cookie HttpOnly de refresh token persistente.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Credenciales incorrectas
        '404':
          description: Usuario no encontrado

  /api/v1/auth/refresh:
    post:
      tags:
        - Users
      summary: Renovar access token
      description: Lee la cookie HttpOnly de refresh token y devuelve un nuevo access token JWT. No requiere Authorization header.
      responses:
        '200':
          description: Access token renovado
          headers:
            Set-Cookie:
              description: Cookie HttpOnly de refresh token reemitida con su max-age.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Refresh token ausente, inválido, revocado o expirado

  /api/v1/auth/logout:
    post:
      tags:
        - Users
      summary: Cerrar sesión
      description: Revoca la sesión de refresh token asociada a la cookie y borra la cookie HttpOnly.
      responses:
        '204':
          description: Sesión cerrada
          headers:
            Set-Cookie:
              description: Cookie HttpOnly de refresh token borrada.
              schema:
                type: string

  /api/v1/auth/password/forgot:
    post:
      tags:
        - Users
      summary: Solicitar recuperación de contraseña
      description: Responde siempre con un mensaje homogéneo y, si la cuenta tiene credencial local, encola un email de recuperación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Respuesta homogénea para el flujo de forgot password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '429':
          description: Demasiados intentos de recuperación

  /api/v1/auth/password/reset:
    post:
      tags:
        - Users
      summary: Restablecer contraseña con token
      description: Valida un token de recuperación de un solo uso, actualiza la contraseña local y no inicia sesión automáticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Token inválido o expirado, o password no válida
        '429':
          description: Demasiados intentos de restablecimiento

  /api/v1/auth/password/change:
    post:
      tags:
        - Users
      summary: Cambiar contraseña local autenticada
      description: Requiere sesión activa, contraseña actual válida y aplica limitación de intentos fallidos para la operación sensible.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Contraseña actual incorrecta o nueva contraseña no válida
        '401':
          description: No autenticado
        '429':
          description: Demasiados intentos de cambio de contraseña

  /api/v1/auth/password/set-local:
    post:
      tags:
        - Users
      summary: Añadir contraseña local a una cuenta Google
      description: Requiere sesión activa y un Google ID token reciente que coincida con el usuario autenticado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLocalPasswordRequest'
      responses:
        '200':
          description: Contraseña local configurada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Cuenta no compatible o googleIdToken inválido/no coincidente
        '401':
          description: No autenticado

  /api/v1/auth/google:
    post:
      tags:
        - Users
      summary: Autenticación con Google OAuth
      description: Autentica un usuario con Google ID Token, retorna un access token JWT y setea una cookie HttpOnly de refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                  description: Token de Google ID obtenido desde el frontend
                  example: eyJhbGciOiJSUzI1NiIsImtpZCI6IjE4MmU0MmVjNjk...
      responses:
        '200':
          description: Autenticación exitosa
          headers:
            Set-Cookie:
              description: Cookie HttpOnly de refresh token persistente.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token para autenticación
                  id:
                    type: integer
                    format: int64
                  email:
                    type: string
                    format: email
                  firstName:
                    type: string
                  lastName:
                    type: string
                  role:
                    type: string
                    enum: [USER, ADMIN, RESTAURANT, SUPERADMIN]
                  imgUser:
                    type: string
        '400':
          description: Token de Google inválido o expirado

  /api/v1/users/me:
    get:
      tags:
        - Users
      summary: Obtener usuario actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No autenticado

    put:
      tags:
        - Users
      summary: Actualizar perfil de usuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/users/me/preferences:
    get:
      tags:
        - Users
      summary: Obtener preferencias de mercado del usuario actual
      description: Devuelve la preferencia persistida del usuario. Si aún no existe, backend opera con WORLDWIDE como valor efectivo por defecto.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferencias de mercado del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMarketPreferences'
        '401':
          description: No autenticado

    patch:
      tags:
        - Users
      summary: Actualizar preferencias de mercado del usuario actual
      description: Permite guardar preferredCountryCode con un ISO alpha-2 real o WORLDWIDE, junto con preferredLocale opcional.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserMarketPreferencesUpdateRequest'
      responses:
        '200':
          description: Preferencias de mercado actualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMarketPreferences'
        '400':
          description: Preferencias inválidas
        '401':
          description: No autenticado

  /api/v1/users/me/security:
    get:
      tags:
        - Users
      summary: Obtener capacidades de seguridad del usuario actual
      description: Devuelve los proveedores autenticados y las capacidades activas para futuros flujos de password y reautenticación.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Capacidades de seguridad del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSecurityCapabilities'
        '401':
          description: No autenticado

  /api/v1/users/me/avatar:
    post:
      tags:
        - Users
      summary: Subir avatar de usuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/users/me/consents:
    post:
      tags:
        - Users
        - Private User API
      summary: Registrar consentimientos del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                termsVersion:
                  type: string
                privacyVersion:
                  type: string
                acceptedTerms:
                  type: boolean
                acceptedPrivacy:
                  type: boolean
      responses:
        '200':
          description: Consentimientos registrados

  /api/v1/users:
    get:
      tags:
        - Users
      summary: Listar todos los usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /api/v1/users/{id}:
    get:
      tags:
        - Users
      summary: Obtener usuario por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Usuario no encontrado

    put:
      tags:
        - Users
        - Private Admin API
      summary: Actualizar usuario por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      tags:
        - Users
        - Private Admin API
      summary: Eliminar usuario por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Usuario eliminado

  /api/v1/users/{id}/role:
    patch:
      tags:
        - Users
        - Private Admin API
      summary: Actualizar rol de usuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [USER, RESTAURANT, ADMIN, SUPERADMIN]
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/users/{id}/restaurants:
    get:
      tags:
        - Users
        - Private Admin API
      summary: Listar restaurantes asignados a un usuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Restaurantes asignados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantBackoffice'
    put:
      tags:
        - Users
        - Private Admin API
      summary: Reemplazar restaurantes asignados a un usuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                restaurantIds:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        '200':
          description: Restaurantes asignados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantBackoffice'

  # ==================== RATINGS ====================
  /api/v1/ratings:
    post:
      tags:
        - Ratings
      summary: Crear rating con imágenes
      description: Crea un nuevo rating para un restaurante. Permite adjuntar hasta 3 imágenes (jpg, jpeg, png, gif, webp). Máximo 5MB por imagen.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - score
                - comment
                - restaurantId
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Puntuación del 1 al 5
                comment:
                  type: string
                  maxLength: 1000
                  description: Comentario del usuario
                restaurantId:
                  type: integer
                  format: int64
                  description: ID del restaurante a calificar
                images:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                    format: binary
                  description: Lista de imágenes (máximo 3)
      responses:
        '200':
          description: Rating creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingPublic'
        '400':
          description: Datos inválidos o más de 3 imágenes
        '404':
          description: Restaurante no encontrado
