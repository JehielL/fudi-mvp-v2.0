  # ==================== RESTAURANTS ====================
  /api/v1/restaurants:
    get:
      tags:
        - Restaurants
        - Public API
      summary: Listar restaurantes
      description: Endpoint publico para listados, catalogo y discovery. Responde solo con RestaurantPublic. Si no se envía country, backend trata la consulta como WORLDWIDE por compatibilidad.
      parameters:
        - name: country
          in: query
          required: false
          schema:
            type: string
          description: ISO alpha-2 del mercado a consultar o WORLDWIDE para devolver todos los restaurantes. Si se omite, el comportamiento efectivo también es WORLDWIDE.
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por ciudad exacta ignorando mayúsculas y espacios exteriores
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por nombre
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
          description: Limita el número de restaurantes devueltos. Los valores superiores a 24 se acotan a 24.
      responses:
        '200':
          description: Lista de restaurantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantPublic'

    post:
      tags:
        - Restaurants
        - Private Restaurant API
      summary: Crear restaurante
      description: Endpoint privado de backoffice para alta de restaurantes del usuario autenticado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - phone
                - restaurantType
                - city
                - address
              properties:
                name:
                  type: string
                phone:
                  type: string
                restaurantType:
                  type: string
                description:
                  type: string
                city:
                  type: string
                address:
                  type: string
                number:
                  type: string
                postalCode:
                  type: string
                groupId:
                  type: integer
                  format: int64
                openingTime:
                  type: string
                  format: time
                closingTime:
                  type: string
                  format: time
                photos:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                photo:
                  type: string
                  format: binary
                imageUrls:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                orderedImageUrls:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                coverImageUrl:
                  type: string
      responses:
        '200':
          description: Restaurante creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantBackoffice'

